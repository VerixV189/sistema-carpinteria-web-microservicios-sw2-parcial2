server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: business-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/carpinteria}
    username: ${SPRING_DATASOURCE_USERNAME:carpinteria}
    password: ${SPRING_DATASOURCE_PASSWORD:carpinteria}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:carpinteria}
    password: ${SPRING_RABBITMQ_PASSWORD:carpinteria}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENERS_ENABLED:true}
  jackson:
    default-property-inclusion: non_null

dgs:
  graphql:
    path: /graphql
    graphiql:
      enabled: true
      path: /graphiql
    subscriptions:
      websockets:
        path: /subscriptions

carpinteria:
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:carpinteria.events}
    queues:
      quotation-approved: business.quotation_approved
      estimation-completed: business.estimation_completed
  jwt-secret: ${JWT_SECRET:dev-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.carpinteria: DEBUG
